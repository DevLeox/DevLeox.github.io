<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile - DevLeox</title>
    <style>
        body {
            background-color: #2e2e2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 2s ease, transform 2s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .profile-header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #444;
        }

        .profile-picture {
            border-radius: 50%;
            width: 150px;
            height: 150px;
        }

        .profile-header h1 {
            font-size: 48px;
            margin: 10px 0;
        }

        .bio {
            font-size: 18px;
            color: #aaa;
            margin: 10px 0;
        }

        .button-follow {
            display: inline-block;
            padding: 15px 100px;
            background-color: #6a0dad;
            color: #ffffff;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .button-follow:hover {
            background-color: #4b0082;
        }

        .followers {
            margin-top: 20px;
        }

        .repo {
            border: 1px solid #444;
            margin: 10px;
            padding: 20px;
            border-radius: 5px;
            background-color: #3e3e3e;
            position: relative;
        }

        .repo h4 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .repo .status {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .button-purple {
            display: inline-block;
            padding: 10px 20px;
            margin-right: 10px;
            background-color: #6a0dad;
            color: #ffffff;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .button-purple:hover {
            background-color: #4b0082;
        }

        .button-outline {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ffffff;
            color: #6a0dad;
            border: 2px solid #6a0dad;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        .button-outline:hover {
            background-color: #f0f0f0;
        }

        .language-bar {
            margin-top: 15px;
            display: none;
        }

        .language-bar .bar {
            margin: 5px 0;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #444;
        }

        .language-bar .bar div {
            height: 100%;
            text-align: center;
            line-height: 20px;
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="profile-header fade-in">
        <img src="" alt="Profile Picture" class="profile-picture" id="profile-picture">
        <h1 id="name">DevLeox</h1>
        <p class="bio" id="bio">Bio will be displayed here.</p>
        <button class="button-follow" id="follow-button">Follow</button>
        <div class="followers">
            <p>Followers: <span id="followers-count">0</span></p>
            <p>Following: <span id="following-count">0</span></p>
        </div>
    </div>
    <div id="repo-list" class="fade-in"></div>
    <script>
        const username = "DevLeox";
        const apiUrl = `https://api.github.com/users/${username}`;
        const reposUrl = `https://api.github.com/users/${username}/repos`;

        async function fetchProfileData() {
            const response = await fetch(apiUrl);
            const data = await response.json();
            document.getElementById('profile-picture').src = data.avatar_url;
            document.getElementById('name').textContent = data.name || username;
            document.getElementById('bio').textContent = data.bio || 'No bio available';
            document.getElementById('followers-count').textContent = data.followers;
            document.getElementById('following-count').textContent = data.following;
            document.getElementById('follow-button').onclick = () => {
                window.open(`https://github.com/${username}?tab=followers`, '_blank');
            };
        }

        async function fetchRepositories() {
            const response = await fetch(reposUrl);
            const repos = await response.json();
            const repoList = document.getElementById('repo-list');
            repos.forEach(repo => {
                const repoDiv = document.createElement('div');
                repoDiv.className = 'repo fade-in';
                repoDiv.innerHTML = `
                    <div class="status">${repo.private ? 'Private' : 'Public'}</div>
                    <h4>${repo.name}</h4>
                    <p>${repo.description || 'No description available'}</p>
                    <button class="button-purple" onclick="window.open('${repo.html_url}', '_blank')">Open Repository</button>
                    <button class="button-outline" onclick="toggleLanguages(this, '${repo.languages_url}')">Show Languages</button>
                    <div class="language-bar" id="languages-${repo.name}"></div>
                `;
                repoList.appendChild(repoDiv);
            });
            revealOnScroll();
        }

        async function toggleLanguages(button, languagesUrl) {
            const languageBar = button.nextElementSibling;
            if (languageBar.style.display === "none" || !languageBar.style.display) {
                const response = await fetch(languagesUrl);
                const languages = await response.json();
                languageBar.innerHTML = '';
                const total = Object.values(languages).reduce((sum, count) => sum + count, 0);
                for (const [language, count] of Object.entries(languages)) {
                    const percentage = ((count / total) * 100).toFixed(2);
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    bar.innerHTML = `<div style="width: ${percentage}%; background-color: #6a0dad;">${language} ${percentage}%</div>`;
                    languageBar.appendChild(bar);
                }
                languageBar.style.display = "block";
                button.textContent = "Hide Languages";
            } else {
                languageBar.style.display = "none";
                button.textContent = "Show Languages";
            }
        }

        function revealOnScroll() {
            const elements = document.querySelectorAll('.fade-in');
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            });
            elements.forEach(el => observer.observe(el));
        }

        fetchProfileData();
        fetchRepositories();
    </script>
</body>
</html>

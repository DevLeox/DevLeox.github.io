<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile - DevLeox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        
        .repo {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        
        .language-bar {
            margin-top: 10px;
            display: none;
        }
        
        .language-info {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="repo-list"></div>

    <script>
        // تابع برای نمایش اطلاعات زبان‌ها
        async function toggleLanguages(button, languagesUrl) {
            const languageBar = button.nextElementSibling;
            
            if (languageBar.style.display === "none" || !languageBar.style.display) {
                const response = await fetch(languagesUrl);
                const languages = await response.json();
                const total = Object.values(languages).reduce((sum, count) => sum + count, 0);
                
                let languageInfo = '<div class="language-info">';
                
                Object.entries(languages).forEach(([language, count]) => {
                    const percent = ((count / total) * 100).toFixed(1);
                    languageInfo += `
                        <div>
                            • ${language}: ${percent}%
                        </div>
                    `;
                });
                
                languageInfo += '</div>';
                languageBar.innerHTML = languageInfo;
                languageBar.style.display = "block";
                button.textContent = "Hide Languages";
            } else {
                languageBar.style.display = "none";
                button.textContent = "Show Languages";
            }
        }

        // تابع برای دریافت ریپازیتوری‌ها
        async function fetchRepositories() {
            const username = "DevLeox";
            const reposUrl = `https://api.github.com/users/${username}/repos`;
            
            try {
                const response = await fetch(reposUrl);
                const repos = await response.json();
                const repoList = document.getElementById('repo-list');
                
                repos.forEach(repo => {
                    const repoDiv = document.createElement('div');
                    repoDiv.className = 'repo';
                    repoDiv.innerHTML = `
                        <h3>${repo.name}</h3>
                        <p>${repo.description || 'No description available'}</p>
                        <button onclick="toggleLanguages(this, '${repo.languages_url}')">Show Languages</button>
                        <div class="language-bar"></div>
                    `;
                    repoList.appendChild(repoDiv);
                });
            } catch (error) {
                console.error('Error fetching repositories:', error);
            }
        }

        // بارگذاری اولیه
        fetchRepositories();
    </script>
</body>
</html>

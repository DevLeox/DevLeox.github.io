<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile - DevLeox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="profile-header fade-in">
        <img src="" alt="Profile Picture" class="profile-picture" id="profile-picture">
        <h1 id="name">DevLeox</h1>
        <p class="bio" id="bio">Bio will be displayed here.</p>
        <button class="button-follow" id="follow-button">Follow</button>
        <div class="followers">
            <p>Followers: <span id="followers-count">0</span></p>
            <p>Following: <span id="following-count">0</span></p>
        </div>
    </div>
    <div id="repo-list" class="fade-in"></div>
    <script src="script.js"></script>
</body>
</html>
